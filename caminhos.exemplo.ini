# Caminhos deste PC. Copie para caminhos.ini (os scripts fazem isso sozinhos
# na primeira vez) e ajuste. Pode usar \ normalmente, sem aspas.
# "~" = sua pasta de usuario (C:\Users\<seu nome>).

[caminhos]
# Pasta onde esta o PES2021.exe
pasta_pes = C:\Program Files (x86)\eFootball PES 2021

# Pasta onde esta o sider.exe (a do patch)
pasta_sider = C:\Program Files (x86)\eFootball PES 2021\PES 2009 Remake

# Onde a NVIDIA (Alt+F9) salva as gravacoes do PES
pasta_videos = ~\Videos\NVIDIA\eFootball PES 2021

[site]
# Usado pelo enviar_resultados.py e, so a url, pelo extrair_eventos.py (le
# os elencos atuais dos times). Este arquivo nao vai para o GitHub, entao o
# token pode ficar aqui.
# Endereco do site da liga, ex.: https://cbfv.exemplo.com
url =
# Seu token de admin do site
token =
# Base de jogadores do PES que o site usa (fica no repositorio do site,
# Fc25_Draft). O extrair_eventos.py corrige os nomes lidos pelo elenco de
# cada time ("Petrbech" -> "Petr Čech"). Vazio = nomes como o OCR leu.
base_jogadores = ~\source\repos\Fc25_Draft\src\Fc25Draft.Infra\Data\Pes\pes-jogadores.json.gz

[youtube]
# Usado pelo youtube/upar_videos.py.
# chrome.exe. Deixe em branco para o script achar sozinho.
chrome =
# Edicao do campeonato e temporada: vao no nome das playlists do canal
# ("Brasileirão - Série A | 3ª Temporada | 8ª Edição"). Troque na virada.
edicao = 8
temporada = 3
